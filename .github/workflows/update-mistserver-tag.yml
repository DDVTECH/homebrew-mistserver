name: Update MistServer Formula from a Tag

on:
  repository_dispatch:
    types: [mistserver-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact public source tag, for example 3.12'
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    uses: ./.github/workflows/bump-mistserver.yml
    with:
      source: tag
      tag: ${{ github.event.client_payload.tag || inputs.tag }}
