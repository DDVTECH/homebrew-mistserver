name: Update MistServer Formula

on:
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bump script
        run: bash scripts/bump-mistserver.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git diff)" ]; then
            VERSION=$(grep '^  version' Formula/mistserver.rb | awk '{print $2}' | tr -d '"')
            git add Formula/mistserver.rb
            git commit -m "Auto-update MistServer to $VERSION"
            git push origin HEAD:main
          else
            echo "No changes; formula is already up-to-date."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
