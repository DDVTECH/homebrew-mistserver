name: Update MistTray Cask

on:
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run bump script
        run: bash scripts/bump-misttray.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git diff)" ]; then
            VERSION=$(grep '^  version' Casks/misttray.rb | awk '{print $2}' | tr -d '"')
            git add Casks/misttray.rb
            git commit -m "Auto-update MistTray to v$VERSION"
            git push origin HEAD:main
          else
            echo "No changes; cask is already up-to-date."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
